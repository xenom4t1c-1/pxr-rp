<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Page not found</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* small override for 404 layout */
    main { padding:120px 0; text-align:center }
    .error-code { font-family:"Oswald",sans-serif;font-size:120px;color:#fff;margin:0 0 12px }
    .error-msg { color:var(--muted);font-size:18px;max-width:760px;margin:0 auto 22px }
    .home-cta { display:inline-block;margin-top:12px;padding:12px 22px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700 }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="assets/logo.png" alt="Phlox Republic" class="brand-logo"></a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="error-code">404</div>
      <h1 class="section-title">Page not found</h1>
      <p class="error-msg">The page you're looking for doesn't exist or has moved. Head back to the homepage and start your story with Phlox Republic Roleplay.</p>
      <a class="home-cta" href="/">Return home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="brand"><img src="assets/logo.png" alt="Phlox Republic" class="footer-logo"><div class="brand-name">Phlox Republic Roleplay</div></div>
      <div class="meta">EST. 2020</div>
    </div>
  </footer>
</body>
</html>
